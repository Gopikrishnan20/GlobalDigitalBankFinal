# Persistence Configuration
# persistence.mode: memory | jdbc | file
persistence.mode=jdbc
persistence.db.url=jdbc:sqlite:gdb.db
persistence.db.driver=org.sqlite.JDBC

# Connection pooling (Activity 25): true = HikariCP pool, false = new connection per request
persistence.pool.enabled=true
persistence.pool.size=10
persistence.pool.timeout=30000

# File storage (Activity 26): used when persistence.mode=file
persistence.file.account.path=data/accounts.csv
persistence.file.transaction.path=data/transactions.csv
persistence.file.backup.enabled=true
persistence.file.backup.max=5
